[project]
name = "research-loop"
version = "0.1.0"
description = "Continuous research loop — Sharpe tracker + auto-halt + nightly backtest harness"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "redis==5.0.8",
    "structlog==24.4.0",
    "asyncpg==0.29.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "PL"]
ignore = [
    "S101",     # asserts in tests
    "PLR2004",  # magic numbers
    "PLR0913",  # too many args
    "PLR0912",  # too many branches
    "S608",     # SQL injection (we use $-params, not f-strings)
    "PLW0603",  # global (intentional in singleton patterns)
    "PLC0415",  # imports not at top-level (intentional lazy loads)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
