services:
  research-loop:
    image: ghcr.io/1305a001-ctrl/research-loop:latest
    container_name: research-loop
    restart: unless-stopped
    env_file:
      - /srv/secrets/research-loop.env
    networks:
      - infra-net
    ports:
      - "127.0.0.1:8015:8015"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json; r=urllib.request.urlopen('http://127.0.0.1:8015/health'); j=json.load(r); raise SystemExit(0 if j.get('status')=='ok' else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  infra-net:
    external: true
    name: infra-net
